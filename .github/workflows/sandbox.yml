name: Local browser sandbox
on:
  push:
    branches: [dev/poker-simulator-v03]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.sandbox-browsers
      POKER_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-sandbox.txt
      - name: Install Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Engine, sandbox and real Chromium tests
        run: python -m unittest discover -s tests -v
      - name: Windows double-click entry point setup smoke
        if: runner.os == 'Windows'
        shell: cmd
        run: start_poker.bat --no-sync --setup-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-${{ matrix.os }}
          path: runs/sandbox-test/*.png
          retention-days: 7
