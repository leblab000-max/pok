name: Poker AI tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: poker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Invariant stress test
        run: PYTHONPATH=. python scripts/stress.py
      - name: Benchmark smoke
        run: |
          python -m poker_ai.benchmark --count 1 --samples 4 --seconds 120 --db smoke.sqlite --report smoke.md > smoke-status.json
          python -c "import json; r=json.load(open('smoke-status.json')); assert r['completed']==12 and not r['budget_exhausted'], r"
      - name: v0.5 benchmark smoke
        run: |
          python -m poker_ai.benchmark_v05 --count 1 --samples 4 --audit-samples 8 --seconds 120 --db v05-smoke.sqlite --out v05-smoke > v05-status.json
          python -c "import json; r=json.load(open('v05-status.json')); assert r['completed']==12 and not r['budget_exhausted'], r"
      - name: v0.6 continuation league smoke
        run: |
          python -m poker_ai.league --split train --seed 12345 --count 1 --samples 4 --policies blend,lookahead,fixed --seconds 90 --db v06-smoke.sqlite --out v06-smoke > v06-status.json
          python -c "import json; r=json.load(open('v06-status.json')); assert r['completed']==9 and not r['budget_exhausted'], r"
      - name: Scheduled reproducible experiment
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m poker_ai.benchmark_v05 --count 3 --samples 16 --audit-samples 32 --seconds 180 --db scheduled.sqlite --out scheduled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-results
          path: |
            smoke.md
            smoke.review.md
            smoke-status.json
            smoke.sqlite
            v06-smoke/
            v06-status.json
            v06-smoke.sqlite
            scheduled/
            v05-smoke/
            v05-status.json
            v05-smoke.sqlite
            scheduled.sqlite
          retention-days: 14
